name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI + PostgreSQL/Supabase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Stack local de Supabase en el runner: PostgreSQL 17 + Auth + Storage.
      # Es la vía real de aplicar migraciones y correr integración (no un postgres pelado).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase local
        run: supabase start
        working-directory: .

      # Captura las claves locales del stack hacia el entorno del job
      # (los valores van a $GITHUB_ENV, nunca al log).
      - name: Capturar credenciales locales del stack
        working-directory: .
        run: |
          supabase status -o env > /tmp/supabase.env
          ANON_KEY=$(sed -n 's/^ANON_KEY="\(.*\)"/\1/p' /tmp/supabase.env)
          SERVICE_ROLE_KEY=$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"/\1/p' /tmp/supabase.env)
          API_URL=$(sed -n 's/^API_URL="\(.*\)"/\1/p' /tmp/supabase.env)
          {
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_URL=$API_URL"
          } >> "$GITHUB_ENV"

      - name: Aplicar migraciones (0001–0019)
        working-directory: .
        run: supabase db reset

      - name: Base de test dedicada (tei_test, clon de la local)
        working-directory: .
        run: |
          CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          SUPABASE_DB_CONTAINER="$CONTAINER" ./scripts/test_db_reset.sh

      - name: Seed de datos ficticios (incluye usuarios de prueba)
        working-directory: .
        run: python scripts/seed_local.py
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          # SUPABASE_SERVICE_ROLE_KEY viene de $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar importación de la app
        run: python -c "from app.main import app; print('OK')"

      # Suite completa contra la base de test: sin skips silenciosos de integración.
      # Los tests NUNCA tocan DATABASE_URL de la app (RA-13): leen NUCLEO_TEST_DATABASE_URL.
      - name: Suite completa (unitarias + integración contra PostgreSQL)
        run: python -m pytest
        env:
          NUCLEO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/tei_test
          NUCLEO_DATABASE_URL: postgresql+psycopg://tei_app:tei_app@127.0.0.1:54322/tei_test
          TEST_ADMIN_EMAIL: admin@tei.local
          TEST_ADMIN_PASSWORD: TEI2026!
          TEST_CONTABILIDAD_EMAIL: contador@tei.local
          TEST_CONTABILIDAD_PASSWORD: TEI2026!
          # SUPABASE_URL / SUPABASE_ANON_KEY vienen de $GITHUB_ENV

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # E2E (Playwright): fase posterior. Requiere build del frontend + backend + stack arriba
  # en el mismo job. Documentado como pendiente en docs/qa/informes/F0-due-diligence.md.
